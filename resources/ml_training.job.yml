resources:
  jobs:
    ml_training:
      name: "PromoFlow demand model training and scoring"
      description: >-
        Trains and registers Cleany's promotion-aware demand model, compares it
        with a seasonal baseline, and batch-scores promotion candidates.
      performance_target: PERFORMANCE_OPTIMIZED
      max_concurrent_runs: 1
      queue:
        enabled: true
      tags:
        solution: promoflow-ai
        customer: cleany
        workload: ml-training
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: feature_schema
          default: promoflow_silver
        - name: feature_table
          default: promotion_training_features
        - name: scoring_table
          default: promotion_candidates
        - name: model_schema
          default: promoflow_ml
        - name: model_name
          default: promotion_demand_model
        - name: output_schema
          default: promoflow_gold
        - name: output_table
          default: promotion_demand_predictions
        - name: experiment_path
          default: /Users/${workspace.current_user.userName}/promoflow-ai-promotion-demand
        - name: trials
          default: "10"
      environments:
        - environment_key: ml
          spec:
            environment_version: "4"
            dependencies:
              - mlflow==3.1.0
              - scikit-learn==1.6.1
              - xgboost==2.1.4
              - optuna==4.1.0
              - pandas==2.2.3
      tasks:
        - task_key: train_register_and_score
          description: Train, evaluate, register at @prod, and write Gold scores.
          notebook_task:
            notebook_path: ../src/ml/train_and_score.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              feature_schema: "{{job.parameters.feature_schema}}"
              feature_table: "{{job.parameters.feature_table}}"
              scoring_table: "{{job.parameters.scoring_table}}"
              model_schema: "{{job.parameters.model_schema}}"
              model_name: "{{job.parameters.model_name}}"
              output_schema: "{{job.parameters.output_schema}}"
              output_table: "{{job.parameters.output_table}}"
              experiment_path: "{{job.parameters.experiment_path}}"
              trials: "{{job.parameters.trials}}"
          environment_key: ml
